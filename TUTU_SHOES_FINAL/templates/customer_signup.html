{% extends "base.html" %}

{% block title %}Create Account | TUTU SHOES{% endblock %}

{% block content %}

<section class="section">
    <div class="form-card">

        <h1>Create Account</h1>

        <p>Create your TUTU SHOES customer account.</p>

        {% if error %}
            <div class="flash">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <button type="submit" class="btn primary full">
                Create Account
            </button>

        </form>

        <p style="margin-top: 20px;">
            Already have an account?
            <a href="{{ url_for('customer_login') }}">
                Login
            </a>
        </p>

    </div>
</section>

{% endblock %}
