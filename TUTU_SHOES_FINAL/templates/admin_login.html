<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | TUTU SHOES</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="admin-auth">
<form class="auth-card" method="POST">
    <div class="logo-mark">T</div><p class="eyebrow">TUTU SHOES</p><h1>Admin Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="btn primary full">Login</button>
    <a class="muted center-link" href="{{ url_for('home') }}">Back to store</a>
</form>
</body></html>
