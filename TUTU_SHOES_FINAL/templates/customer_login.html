{% extends "base.html" %}

{% block title %}Customer Login | TUTU SHOES{% endblock %}

{% block content %}

<section class="section">
    <div class="form-card">

        <h1>Customer Login</h1>

        <p>Login to your TUTU SHOES account.</p>

        {% if error %}
            <div class="flash">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn primary full">
                Login
            </button>

        </form>

        <p style="margin-top: 20px;">
            Don't have an account?
            <a href="{{ url_for('customer_signup') }}">
                Create Account
            </a>
        </p>

    </div>
</section>

{% endblock %}
