<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product | TUTU SHOES</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body class="admin-body">

<header class="admin-header">

    <a
        class="brand"
        href="{{ url_for('admin_dashboard') }}"
    >
        TUTU SHOES ADMIN
    </a>

    <nav>
        <a href="{{ url_for('admin_products') }}">
            Products
        </a>
    </nav>

</header>


<main class="admin-main narrow">

    <div class="admin-head">

        <div>

            <p class="eyebrow">
                CATALOGUE
            </p>

            <h1>
                Add Product
            </h1>

        </div>

    </div>


    <form
        class="form-card"
        method="POST"
        action="{{ url_for('add_product') }}"
        enctype="multipart/form-data"
    >

        <div class="form-grid">

            <label>
                Product Name

                <input
                    type="text"
                    name="product_name"
                    value="{{ product.product_name if product else '' }}"
                    required
                >

            </label>


            <label>
                Brand

                <input
                    type="text"
                    name="brand"
                    value="{{ product.brand if product else '' }}"
                    placeholder="Nike, Adidas, Puma..."
                >

            </label>


            <label>
                Category

                <select name="category" required>

                    {% for c in categories %}

                    <option
                        value="{{ c }}"
                        {% if product and product.category == c %}selected{% endif %}
                    >
                        {{ c }}
                    </option>

                    {% endfor %}

                </select>

            </label>


            <label>
                Gender

                <select name="gender" required>

                    {% for g in genders %}

                    <option
                        value="{{ g }}"
                        {% if product and product.gender == g %}selected{% endif %}
                    >
                        {{ g }}
                    </option>

                    {% endfor %}

                </select>

            </label>


            <label>
                Price (₹)

                <input
                    type="number"
                    name="price"
                    step="0.01"
                    min="0"
                    value="{{ product.price if product else '' }}"
                    required
                >

            </label>


            <label>
                Stock Quantity

                <input
                    type="number"
                    name="stock_quantity"
                    min="0"
                    value="{{ product.stock_quantity if product else 0 }}"
                    required
                >

            </label>


            <label>
                Sizes

                <input
                    type="text"
                    name="sizes"
                    value="{{ product.sizes if product else '' }}"
                    placeholder="6,7,8,9,10"
                >

            </label>


            <label>
                Colors

                <input
                    type="text"
                    name="colors"
                    value="{{ product.colors if product else '' }}"
                    placeholder="Black,Brown,White"
                >

            </label>


            <label class="wide">
                Product Image

                <input
                    type="file"
                    name="product_image"
                    accept=".jpg,.jpeg,.png,.webp"
                >

                <small>
                    JPG, JPEG, PNG or WEBP
                </small>

            </label>


            <label class="wide">
                Description

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Enter product description..."
                >{{ product.description if product else '' }}</textarea>

            </label>


            <label>
                Status

                <select name="status">

                    <option
                        value="Active"
                        {% if not product or product.status == 'Active' %}selected{% endif %}
                    >
                        Active
                    </option>

                    <option
                        value="Inactive"
                        {% if product and product.status == 'Inactive' %}selected{% endif %}
                    >
                        Inactive
                    </option>

                </select>

            </label>

        </div>


        <div class="form-actions">

            <button
                class="btn primary"
                type="submit"
            >
                Save Product
            </button>

            <a
                class="btn"
                href="{{ url_for('admin_products') }}"
            >
                Cancel
            </a>

        </div>

    </form>

</main>

</body>

</html>
